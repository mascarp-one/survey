<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Короткий опрос</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{--teal:#028c99;--red:#d84530;--sand:#fcb05d;--ink:#000;--gray:#5f5f5f}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--teal);color:#fff;font-family:Inter,"Liberation Sans",Arial,sans-serif}
.step{position:fixed;top:max(18px,env(safe-area-inset-top));right:max(22px,env(safe-area-inset-right));background:var(--red);color:#fff;font-size:14px;font-weight:600;padding:7px 15px;border-radius:999px}
.wrap{max-width:560px;margin:0 auto;padding:84px 20px 48px}
h1{font-size:28px;line-height:1.25;font-weight:700;margin:0 0 22px;letter-spacing:-.01em}
h1.long{font-size:22px;line-height:1.4;font-weight:600}
.sub{margin:-12px 0 22px;font-size:16px;line-height:1.45;opacity:.92}
.card{background:var(--sand);color:var(--ink);border-radius:22px;padding:18px;display:grid;grid-template-columns:104px 1fr;gap:16px;min-height:132px;margin-bottom:22px}
.pic{display:flex;align-items:center;justify-content:center;height:104px}
.pic img{max-width:100%;max-height:100%;object-fit:contain}
.info{display:flex;flex-direction:column;min-width:0}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.name{font-size:22px;font-weight:700;flex:1 1 auto}
.price{font-size:24px;font-weight:700;margin-left:auto;white-space:nowrap}
.cond{font-size:14px;margin-top:6px;line-height:1.35}
.bottom{margin-top:auto;padding-top:10px;text-align:right;font-size:14px}
.bottom .off{margin-right:10px}
.bottom s{color:var(--gray);text-decoration-color:var(--gray)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{font:inherit;font-size:17px;font-weight:600;background:var(--red);color:#fff;border:0;border-radius:14px;height:54px;cursor:pointer}
button:disabled{opacity:.7;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
label{display:block;font-size:15px;margin:0 0 8px}
input{width:100%;height:54px;border-radius:14px;border:0;padding:0 16px;font:inherit;font-size:18px;margin-bottom:12px;color:#000}
.err{min-height:20px;font-size:14px;font-weight:600;margin:-4px 0 8px}
.ok{width:100%}
.thanks{min-height:100vh;display:flex;align-items:center}
.thanks p{font-size:30px;line-height:1.3;font-weight:700;margin:0;letter-spacing:-.01em;color:var(--sand)}
@media(max-width:480px){.wrap{padding-top:76px}h1{font-size:23px}h1.long{font-size:19px}.card{grid-template-columns:80px 1fr;gap:12px;padding:14px}.pic{height:80px}.name{font-size:19px}.price{font-size:21px}.thanks p{font-size:25px}}
</style></head><body>

const NAME={hp:'Наушники',tab:'Планшет',lamp:'Лампа',vac:'Робот-пылесос',tic:'Авиабилет'};
const rub=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'\u00A0')+'\u00A0₽';
const pick=a=>a[Math.floor(Math.random()*a.length)];
const ID=(window.crypto&&crypto.randomUUID?crypto.randomUUID():'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,12)).slice(0,40);

// группы формируются случайно в браузере
const Q1G={
 'наушники_500':{p:'hp',old:3500,off:500,label:'скидка 500 ₽'},
 'планшет_500':{p:'tab',old:20000,off:500,label:'скидка 500 ₽'},
 'наушники_10%':{p:'hp',old:3500,off:350,label:'скидка 10%'},
 'планшет_10%':{p:'tab',old:20000,off:2000,label:'скидка 10%'}};
const G1=pick(Object.keys(Q1G)), G23=pick(['лампа','пылесос']), G4=pick(['наушники','планшет']);

function card(p,old,off,label,cond){
 return `<div class="card"><div class="pic"><img src="${IMG[p]}" alt="${NAME[p]}"></div><div class="info">
 <div class="top"><span class="name">${NAME[p]}</span><span class="price">${rub(old-off)}</span></div>
 ${cond?`<div class="cond">${cond}</div>`:''}
 <div class="bottom"><span class="off">${label}</span><s>${rub(old)}</s></div></div></div>`;
}
function plain(p,price){
 return `<div class="card"><div class="pic"><img src="${IMG[p]}" alt="${NAME[p]}"></div><div class="info"><div class="top"><span class="name">${NAME[p]}</span><span class="price">${rub(price)}</span></div></div></div>`;
}

const SCREENS=[
 ()=>{const g=Q1G[G1];return{h:'Согласен подождать ради скидки?',card:card(g.p,g.old,g.off,g.label,'Доставка на 4 дня дольше'),group:G1,btns:[['Нет','нет'],['Да','да']]}},
 ()=>G23==='лампа'
  ?{h:'Представь: тебе нужно купить на Авито лампу за 4000 р. Есть вариант забрать её со скидкой 1000 р, но придется час ехать до продавца. Поедешь?',card:card('lamp',4000,1000,'скидка 1000 ₽','Час ехать до продавца'),group:'лампа',btns:[['Не поеду','не поеду'],['Поеду','поеду']]}
  :{h:'Представь: тебе нужно купить на Авито робот-пылесос за 30000 р. Есть вариант забрать его со скидкой 1000 р, но придется час ехать до владельца. Поедешь?',card:card('vac',30000,1000,'скидка 1000 ₽','Час ехать до владельца'),group:'пылесос',btns:[['Не поеду','не поеду'],['Поеду','поеду']]},
 ()=>{const a=G23==='лампа'?5000:15000;return{h:`Авиабилет домой ${a} р, возможна скидка 1000 р, но вылет в 6 утра.`,sub:'Купишь?',card:card('tic',a,1000,'скидка 1000 ₽','Вылет в 6 утра'),group:'билет_'+a,btns:[['Не куплю','не куплю'],['Куплю','куплю']]}},
 ()=>G4==='наушники'
  ?{h:'Какая минимальная скидка нужна, чтобы ты проехал за наушниками за 3500 р лишние два часа, если можно купить за 3500 такие же здесь и сейчас?',card:plain('hp',3500),group:'наушники',input:true}
  :{h:'Какая минимальная скидка нужна, чтобы ты поехал за планшетом за 20000 р лишние два часа, если можно купить такой же здесь и сейчас?',card:plain('tab',20000),group:'планшет',input:true}
];

function send(step,group,answer,tries){
 tries=tries||0;
 // повторная отправка безопасна: сервер игнорирует дубли
 fetch(ENDPOINT,{method:'POST',mode:'no-cors',keepalive:true,headers:{'Content-Type':'text/plain;charset=utf-8'},
  body:JSON.stringify({id:ID,step:step,group:group,answer:answer})})
  .catch(()=>{if(tries<4)setTimeout(()=>send(step,group,answer,tries+1),1500*(tries+1))});
}

let step=0,busy=false,cur=null;
function render(){
 const app=document.getElementById('app');busy=false;
 if(step>=SCREENS.length){app.innerHTML='<div class="wrap thanks"><p>Спасибо за участие в опросе. Это было нужно для нашего проекта по микроэкономике.</p></div>';window.scrollTo(0,0);return}
 const s=cur=SCREENS[step]();
 app.innerHTML=`<div class="step">Шаг ${step+1} из 4</div><div class="wrap"><h1${s.h.length>60?' class="long"':''}>${s.h}</h1>${s.sub?`<p class="sub">${s.sub}</p>`:''}${s.card}
 ${s.input?`<label for="v">Просьба написать только число — рубли</label><input id="v" type="text" inputmode="decimal" autocomplete="off"><div class="err" id="err" role="alert"></div><button class="ok" id="okb">ОК</button>`
 :`<div class="btns">${s.btns.map(b=>`<button data-v="${b[1]}">${b[0]}</button>`).join('')}</div>`}</div>`;
 window.scrollTo(0,0);
 if(s.input){const inp=document.getElementById('v');document.getElementById('okb').onclick=submitNum;inp.onkeydown=e=>{if(e.key==='Enter')submitNum()}}
 else app.querySelectorAll('.btns button').forEach(b=>b.onclick=()=>{if(busy)return;busy=true;app.querySelectorAll('button').forEach(x=>x.disabled=true);next(b.dataset.v)});
}
function next(answer){send(step+1,cur.group,answer);step++;render()}
function submitNum(){
 if(busy)return;
 const v=document.getElementById('v').value.trim().replace(/\s/g,'').replace(',','.');
 if(!/^\d+(\.\d+)?$/.test(v)||Number(v)>1000000){document.getElementById('err').textContent='Введите только число — сумму в рублях';return}
 busy=true;document.getElementById('okb').disabled=true;next(v);
}
render();
</script></body></html>
